{% extends 'base.html' %}
{% load static %}

{% block content %}
 <!-- Page Header Start -->
 <div class="page-header">
    <div class="container">
        <div class="row">
            <div class="col-12">
                <h2> Blog Page</h2>
            </div>
            <div class="col-12">
                <a href="{% url 'home' %}">Home</a>
                <a href="{% url 'blogs' %}">Blog </a>
            </div>
        </div>
    </div>
</div>
<!-- Page Header End -->


<!-- Single Post Start-->
<div class="single">
    <div class="container">
        <div class="row">
            <div class="col-lg-12">
                <div class="single-content wow fadeInUp">
                    <img src="{{ blog.blogthumbnail.url }}" />
                   <p>
                       {{blog.blogbody | safe }}
                   </p>
                </div>
               
                <div class="single-bio wow fadeInUp">
                    <div class="single-bio-img">
                        <img src="{{ blog.blogwriterphoto.url }}" />
                    </div>
                    <div class="single-bio-text">
                        <h3>
                            {{blog.blogwriter}}
                        </h3>
                        <p>
                            {{blog.blogwriterinfo}}
                        </p>
                    </div>
                </div>
                
            </div>

            
        </div>
    </div>
</div>
<!-- Single Post End--> 


{% endblock %}
