<!-- Team Start -->
{% load static  %}
<div class="team">
    <div class="container">
        <div class="section-header text-center">
            <p>Our Team
      
            </p>
            <h2>Administrator Team</h2>
        </div>
        
        <div class="row">
            
            {% for a in adminis %}
            <div class="col-lg-4 py-5 col-md-6 wow fadeInUp" data-wow-delay="0.1s">
                <div class="card" >
                    <img src="{{a.photo.url}}" class="card-img-top" alt="team iamge" style="height: 300px;object-fit: cover;">
                    <div class="card-body">
                      <h5 class="card-title">
                          {{a.name}}
                      </h5>
                      <p class="card-text">
                          {{a.post}}
                      </p>
                      <p class="card-text">
                        {{a.mobileno}}
                    </p>
                    <p class="card-text">
                      {{a.email}}
                  </p>
                    </div>
                    
                   
                  </div>
            </div>
            {% endfor %}
           
        </div>
        <div class=" mt-5 section-header text-center">
            <h2>
                Engineering Team
            </h2>
        </div>
        <div class="row">
            {% for e in engineer %}
            <div class="col-lg-4 py-5 col-md-6 wow fadeInUp" data-wow-delay="0.1s">
                <div class="card" >
                    <img src="{{e.photo.url}}" class="card-img-top" alt="team iamge" style="height: 300px;object-fit: cover;">
                    <div class="card-body">
                      <h5 class="card-title">
                          {{e.name}}
                      </h5>
                      <p class="card-text">
                          {{e.post}}
                      </p>
                      <p class="card-text">
                        {{e.mobileno}}
                    </p>
                    <p class="card-text">
                      {{e.email}}
                  </p>
                    </div>
                  
                   
                  </div>
            </div>
            {% endfor %}

         
           
        </div>
    </div>
</div>
<!-- Team End -->
