<!-- Team Start -->
{% load static  %}
<div class="team">
    <div class="container">
        <div class="section-header text-center">
            <p>Our Team</p>
            <h2>Administrator Team</h2>
        </div>
        <div class="row">
            
            {% for a in adminis %}
            <div class="col-lg-3 col-md-6 wow fadeInUp" data-wow-delay="0.1s">
                <div class="team-item">
                    <div class="team-img">
                        <img src="{{ a.photo.url }}" alt="Team Image">
                    </div>
                    <div class="team-text">
                        <h2>
                            {{ a.name }}
                        </h2>
                        <p>
                            {{a.post}}
                        </p>
                        <p>
                            {{a.mobileno}}
                        </p>
                        <p>
                            {{a.email}}
                        </p>
                    </div>
                    <div class="team-social">
                        <a class="social-tw" href=""><i class="fab fa-twitter"></i></a>
                        <a class="social-fb" href=""><i class="fab fa-facebook-f"></i></a>
                        <a class="social-li" href=""><i class="fab fa-linkedin-in"></i></a>
                        <a class="social-in" href=""><i class="fab fa-instagram"></i></a>
                    </div>
                </div>
            </div>
            {% endfor %}
           
        </div>
        <div class=" section-header text-center">
            <h2>
                Engineering Team
            </h2>
        </div>
        <div class="row">
            {% for e in engineer %}
            <div class="col-lg-3 col-md-6 wow fadeInUp" data-wow-delay="0.1s">
                <div class="team-item">
                    <div class="team-img">
                        <img src="{{ e.photo.url }}" alt="Team Image">
                    </div>
                    <div class="team-text">
                        <h2>{{ e.name }}</h2>
                        <p>{{ e.post }}</p>
                        <p>{{ e.mobileno }}</p>
                        <p>{{ e.email }}</p>
                    </div>
                    <div class="team-social">
                        <a class="social-tw" href=""><i class="fab fa-twitter"></i></a>
                        <a class="social-fb" href=""><i class="fab fa-facebook-f"></i></a>
                        <a class="social-li" href=""><i class="fab fa-linkedin-in"></i></a>
                        <a class="social-in" href=""><i class="fab fa-instagram"></i></a>
                    </div>
                </div>
            </div>
            {% endfor %}

         
           
        </div>
    </div>
</div>
<!-- Team End -->
