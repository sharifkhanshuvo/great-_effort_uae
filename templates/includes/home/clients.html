
{% load static %}
<div class="container">
  <div class="section-header text-center">
   <h1> Our Main CLients</h1>
  </div>
  <div class="owl-carousel owl-theme" style="display: block !important;" >
    {% for c in client %}
    <div class="item text-center mx-auto">
        <div class="col-lg-3 col-md-6 wow fadeInUp" data-wow-delay="0.1s">
          <div class="team-item">
              <div class="team-img">
                  <img src="{{c.companylogo.url}}" style="height: 200px;width: 200px;"  alt="Team Image">
              </div>
              <div class="team-text  ">
                  <h2 >
                      {{c.companyname}}
                  </h2>
                 
              </div>
            
          </div>
      </div>
      </div>
     
    {% endfor %}
   
  </div>
</div>
